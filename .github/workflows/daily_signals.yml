name: Daily Stock Signals

on:
  schedule:
    # Every weekday at 14:00 UTC (~17:00 Israel time)
    - cron: '0 14 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-signals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run evaluate + generate signals
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py --evaluate
          python main.py --send

      - name: Commit updated tracking file
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/signals_history.csv || true
          git diff --staged --quiet || git commit -m "Update signals tracking $(date -u +%Y-%m-%d)"
          git push